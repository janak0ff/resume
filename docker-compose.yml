services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_saas
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume_dev_password
    ports:
      - "5432:5432"
    volumes:
      - resume-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resume-postgres-data:
